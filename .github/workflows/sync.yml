name: Guild sync
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sync.mjs', '.github/workflows/sync.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: guild-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Actiari/imperial-break-rooms-sync' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: node sync.mjs
        env:
          SYNC_VISIBILITY: ${{ github.event.repository.visibility }}
  heartbeat:
    if: github.repository == 'Actiari/imperial-break-rooms-sync' && github.event.repository.visibility == 'public' && github.event_name == 'schedule' && github.run_number % 100 == 0
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: node heartbeat.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_VISIBILITY: ${{ github.event.repository.visibility }}
